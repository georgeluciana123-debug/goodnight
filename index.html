<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Particle Morphing Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* Sleek configuration dashboard overlaid on top */
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(15, 15, 25, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      border-radius: 30px;
      display: flex;
      gap: 15px;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .controls input, .controls select {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }
    .controls input:focus {
      border-color: #ff8ab4;
    }
  </style>
</head>
<body>

  <canvas id="flower"></canvas>

  <!-- Interactive Dashboard Configuration -->
  <div class="controls">
    <div>
      <input type="text" id="textInput" value="GOODNIGHT MON CHERI EVANCE" maxlength="35" placeholder="Change message...">
    </div>
    <div>
      <select id="paletteInput">
        <option value="rose">Warm Rose</option>
        <option value="moonlit">Moonlit Lavender</option>
        <option value="amber">Cosmic Gold</option>
        <option value="emerald">Emerald Aurora</option>
      </select>
    </div>
  </div>

  <script>
    /**
     * Fluid Particle Morphing System
     * Configured for: GOODNIGHT MON CHERI EVANCE
     */

    const canvas = document.getElementById('flower');
    const ctx = canvas.getContext('2d');

    let width, height, dpr;
    let particles = [];
    let flowerSet = [];
    let textSet = [];

    // Configuration Engine Parameters
    const CONFIG = {
      particleCount: 1650, // Optimised for longer custom text density
      text: "GOODNIGHT MON CHERI EVANCE",
      palette: "rose", 
      ease: 0.045,
      friction: 0.82
    };

    // Device Pixel Ratio scaling to ensure absolute text crispness
    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // ---------- Geometric Generators ----------

    function generateFlowerPoints(count, scale) {
      const pts = [];
      const petals = 5;
      let attempts = 0;

      const centerCount = Math.floor(count * 0.12);
      const petalCount = count - centerCount;

      while (pts.length < petalCount && attempts < petalCount * 60) {
        attempts++;
        const theta = Math.random() * Math.PI * 2;
        const maxR = Math.cos(petals * theta);
        if (maxR <= 0) continue; 
        
        const r = Math.sqrt(Math.random()) * maxR;
        const x = r * Math.cos(theta) * 20;
        const y = r * Math.sin(theta) * 20;
        pts.push({ x: x * scale, y: y * scale });
      }

      for (let i = 0; i < centerCount; i++) {
        const ang = Math.random() * Math.PI * 2;
        const rad = Math.sqrt(Math.random()) * 3.2;
        pts.push({ x: Math.cos(ang) * rad * scale, y: Math.sin(ang) * rad * scale });
      }

      return pts;
    }

    function generateTextPoints(text, count, fontSize, fontFamily) {
      const off = document.createElement('canvas');
      const octx = off.getContext('2d');
      const w = Math.max(700, text.length * fontSize * 0.65);
      const h = fontSize * 2.5;
      
      off.width = w;
      off.height = h;
      octx.fillStyle = '#fff';
      octx.font = `bold ${fontSize}px ${fontFamily}`;
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillText(text, w / 2, h / 2);

      const data = octx.getImageData(0, 0, w, h).data;
      const candidates = [];
      const step = 2;

      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          const idx = (y * w + x) * 4;
          if (data[idx + 3] > 128) { 
            candidates.push({ x: x - w / 2, y: y - h / 2 });
          }
        }
      }

      const pts = [];
      if (candidates.length === 0) candidates.push({ x: 0, y: 0 });
      
      for (let i = 0; i < count; i++) {
        const c = candidates[Math.floor(Math.random() * candidates.length)];
        pts.push({ x: c.x, y: c.y });
      }
      return pts;
    }

    // ---------- Particle Physics Engine ----------

    class Particle {
      constructor(home) {
        this.x = (Math.random() - 0.5) * window.innerWidth * 2;
        this.y = (Math.random() - 0.5) * window.innerHeight * 2;
        this.vx = 0;
        this.vy = 0;
        this.size = 1.1 + Math.random() * 2.0;
        this.hueShift = Math.random() * 40 - 20;
        this.target = home;
      }

      update(pulse) {
        const tx = this.target.x * pulse;
        const ty = this.target.y * pulse;
        
        this.vx += (tx - this.x) * CONFIG.ease;
        this.vy += (ty - this.y) * CONFIG.ease;
        this.vx *= CONFIG.friction;
        this.vy *= CONFIG.friction;
        
        this.x += this.vx;
        this.y += this.vy;
      }

      getColor() {
        let baseHue = 340; // Default Warm Rose
        if (CONFIG.palette === 'moonlit') baseHue = 220;
        if (CONFIG.palette === 'amber') baseHue = 45;
        if (CONFIG.palette === 'emerald') baseHue = 150;

        const hue = (baseHue + this.hueShift + 360) % 360;
        return `hsl(${hue}, 80%, ${60 + Math.random() * 15}%)`;
      }
    }

    function buildSets() {
      const baseScale = Math.min(width, height) / 46;
      flowerSet = generateFlowerPoints(CONFIG.particleCount, baseScale);

      // Responsive font sizing calculations for long phrase mapping
      const fontSize = Math.min(width, height) * 0.055;
      textSet = generateTextPoints(CONFIG.text, CONFIG.particleCount, fontSize, 'Georgia, serif');

      while (flowerSet.length < CONFIG.particleCount) flowerSet.push({ x: 0, y: 0 });
      while (textSet.length < CONFIG.particleCount) textSet.push({ x: 0, y: 0 });

      if (particles.length === 0) {
        for (let i = 0; i < CONFIG.particleCount; i++) {
          particles.push(new Particle(flowerSet[i]));
        }
      } else {
        const currentPhaseTarget = (phase === 'toText' || phase === 'holdText') ? textSet : flowerSet;
        for (let i = 0; i < CONFIG.particleCount; i++) {
          particles[i].target = currentPhaseTarget[i];
        }
      }
    }

    // ---------- Animation Loop State Machine ----------

    let phase = 'formFlower';
    let phaseStart = performance.now();
    const DURATIONS = {
      formFlower: 1800,
      holdFlower: 1000,
      sway: 2200,
      toText: 1800,
      holdText: 3800, // Ample reading window for custom layout text
      toFlower: 1800,
    };

    function setTargets(set) {
      for (let i = 0; i < CONFIG.particleCount; i++) {
        particles[i].target = set[i];
      }
    }

    function draw(now) {
      const elapsed = now - phaseStart;
      const cx = width / 2;
      const cy = height / 2;

      if (phase === 'formFlower' && elapsed > DURATIONS.formFlower) {
        phase = 'holdFlower'; phaseStart = now;
      } else if (phase === 'holdFlower' && elapsed > DURATIONS.holdFlower) {
        phase = 'sway'; phaseStart = now;
      } else if (phase === 'sway' && elapsed > DURATIONS.sway) {
        setTargets(textSet); phase = 'toText'; phaseStart = now;
      } else if (phase === 'toText' && elapsed > DURATIONS.toText) {
        phase = 'holdText'; phaseStart = now;
      } else if (phase === 'holdText' && elapsed > DURATIONS.holdText) {
        setTargets(flowerSet); phase = 'toFlower'; phaseStart = now;
      } else if (phase === 'toFlower' && elapsed > DURATIONS.toFlower) {
        phase = 'holdFlower'; phaseStart = now;
      }

      let pulse = 1;
      let rotation = 0;
      if (phase === 'sway') {
        const t = elapsed / DURATIONS.sway;
        pulse = 1 + Math.sin(t * Math.PI * 2) * 0.06;
        rotation = Math.sin(t * Math.PI * 2) * 0.1;
      }

      ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
      ctx.fillRect(0, 0, width, height);

      const cosR = Math.cos(rotation);
      const sinR = Math.sin(rotation);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.update(pulse);

        let dx = p.x, dy = p.y;
        if (phase === 'sway') {
          dx = p.x * cosR - p.y * sinR;
          dy = p.x * sinR + p.y * cosR;
        }

        ctx.beginPath();
        ctx.fillStyle = p.getColor();
        ctx.arc(cx + dx, cy + dy, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    // ---------- Interface Interactions ----------

    document.getElementById('textInput').addEventListener('input', (e) => {
      if (e.target.value.trim() !== "") {
        CONFIG.text = e.target.value.toUpperCase();
        buildSets();
      }
    });

    document.getElementById('paletteInput').addEventListener('change', (e) => {
      CONFIG.palette = e.target.value;
    });

    window.addEventListener('resize', () => {
      resize();
      buildSets();
    });

    // Run Engine Initialisation
    resize();
    buildSets();
    ctx.fillStyle = '#000';
